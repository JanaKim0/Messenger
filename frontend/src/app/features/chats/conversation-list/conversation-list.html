@if (conversations().length === 0) {
  <div class="empty">
    <p>No conversations yet.</p>
    <p class="hint">Search for someone above to start chatting.</p>
  </div>
} @else {
  <ul class="list">
    @for (c of conversations(); track c.id) {
      <li>
        <button
          type="button"
          class="item"
          [class.active]="c.id === selectedId()"
          (click)="select.emit(c)"
        >
          <app-avatar
            [firstName]="c.otherUser.firstName"
            [lastName]="c.otherUser.lastName"
            [photo]="c.otherUser.photo"
            [size]="46"
          />
          <div class="item-body">
            <div class="item-top">
              <span class="item-name">{{ c.otherUser.firstName }} {{ c.otherUser.lastName }}</span>
              <span class="item-time">{{ formatTime(c.lastMessageAt) }}</span>
            </div>
            <div class="item-bottom">
              <span class="item-preview">{{ c.lastMessage ?? 'No messages yet' }}</span>
              @if (c.unreadCount > 0) {
                <span class="unread">{{ c.unreadCount }}</span>
              }
            </div>
          </div>
        </button>
      </li>
    }
  </ul>
}
