spring.application.name=sitapp-backend
server.port=8080

# =========================================================
#  Datasource - H2 file-based (default development profile)
#  Switch to PostgreSQL with:  --spring.profiles.active=postgres
# =========================================================
spring.datasource.url=jdbc:h2:file:./data/sitapp;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ---- H2 web console at http://localhost:8080/h2-console ----
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =========================================================
#  JWT settings (override the secret via APP_JWT_SECRET in prod)
# =========================================================
app.jwt.secret=${APP_JWT_SECRET:dev-only-secret-please-change-in-production-0123456789abcdef}
app.jwt.expiration-ms=86400000
