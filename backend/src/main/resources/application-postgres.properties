# =========================================================
#  PostgreSQL profile - activate with:
#    ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
#  or set  spring.profiles.active=postgres
#
#  Expects a database named "sitapp". Credentials can be supplied
#  via the DB_USER / DB_PASSWORD environment variables.
# =========================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/sitapp
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:sitapp}
spring.datasource.password=${DB_PASSWORD:sitapp}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# No H2 console when running against PostgreSQL
spring.h2.console.enabled=false
